; Heltec WiFi LoRa 32 V3 — Raamses agent alert pager
[env:heltec-v3-raamses-broken]
extends = esp32s3_base
board = heltec_wifi_lora_32_V3

custom_meshtastic_hw_model = 1
custom_meshtastic_hw_model_slug = HELTEC_V3_RAAMSES
custom_meshtastic_architecture = esp32s3
custom_meshtastic_display_name = Heltec V3 Raamses

build_flags =
  ${esp32s3_base.build_flags}
  -I variants/esp32s3/heltec-v3-raamses
  -D HELTEC_V3
  -D HAS_RAAMSES
  -D HAS_SCREEN
  -D RAAMSES_GATEWAY_HOST=\"192.168.6.230\"
  -D RAAMSES_GATEWAY_PORT=8765
  -D RAAMSES_DEVICE_TYPE=\"heltec_v3\"
  -D RAAMSES_WIFI_SSID=\"seanrohde\"
  -D RAAMSES_WIFI_PASS=\"piperbbs123\"
  -D VIBRATION_MOTOR_PIN=21
  -DRADIOLIB_EXCLUDE_SX128X=1
  -DRADIOLIB_EXCLUDE_LR11X0=1
  -DRADIOLIB_EXCLUDE_LR2021=1

build_src_filter =
  ${esp32s3_base.build_src_filter}
  +<../variants/esp32s3/heltec-v3-raamses>

lib_deps =
  ${esp32s3_base.lib_deps}
