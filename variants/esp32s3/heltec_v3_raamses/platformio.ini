[env:heltec-v3-raamses]
custom_meshtastic_hw_model = 43
custom_meshtastic_hw_model_slug = HELTEC_V3_RAAMSES
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_actively_supported = false
custom_meshtastic_support_level = 3
custom_meshtastic_display_name = Heltec V3 (Raamses)
custom_meshtastic_images = heltec-v3.svg, heltec-v3-case.svg
custom_meshtastic_tags = Heltec, Raamses
custom_meshtastic_partition_scheme = 8MB
 
extends = esp32s3_base
board = heltec_wifi_lora_32_V3
board_level = pr
board_check = true
board_build.partitions = default_8MB.csv
build_flags = 
  ${esp32s3_base.build_flags}
  -D HELTEC_V3
  -D HELTEC_V3_RAAMSES
  -D HAS_RAAMSES
  -I variants/esp32s3/heltec_v3_raamses
