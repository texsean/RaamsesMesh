; ThinkNode M2 — Raamses agent alert pager (ESP32-S3 + LoRa)
[env:thinknode-m2-raamses]
extends = esp32s3_base
board = ESP32-S3-WROOM-1-N4
board_level = extra

extra_scripts =
  pre:variants/esp32s3/thinknode-m2-raamses/force_arduino.py

custom_meshtastic_hw_model = 3
custom_meshtastic_hw_model_slug = THINKNODE_M2_RAAMSES
custom_meshtastic_architecture = esp32s3
custom_meshtastic_display_name = ThinkNode M2 Raamses

build_flags =
  ${esp32s3_base.build_flags}
  -I variants/esp32s3/thinknode-m2-raamses
  -D THINKNODE_M2
  -D HAS_RAAMSES
  -D HAS_SCREEN
  -D RAAMSES_GATEWAY_HOST=\\\"192.168.6.230\\\"
  -D RAAMSES_GATEWAY_PORT=8765
  -D RAAMSES_DEVICE_TYPE=\\\"thinknode_m2\\\"
  -D RAAMSES_WIFI_SSID=\\\"seanrohde\\\"
  -D RAAMSES_WIFI_PASS=\\\"piperbbs123\\\"
  -D VIBRATION_MOTOR_PIN=-1
  -DRADIOLIB_EXCLUDE_SX128X=1
  -DRADIOLIB_EXCLUDE_LR11X0=1
  -DRADIOLIB_EXCLUDE_LR2021=1

build_src_filter =
  ${esp32s3_base.build_src_filter}
  +<../variants/esp32s3/thinknode-m2-raamses>

lib_deps =
  ${esp32s3_base.lib_deps}
